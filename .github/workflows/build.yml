name: Build ZIPs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official FolkPatch APK
        run: |
          curl -sL -o FolkPatch.apk https://github.com/LyraVoid/FolkPatch/releases/download/kp0.13.8/FolkPatch_115032_5.0_on_main-release.apk
          sha256sum FolkPatch.apk
      - name: Build flashable ZIPs
        run: |
          if [ -n "${{ github.ref_name }}" ]; then
            python tools/build.py --tag "${{ github.ref_name }}"
          else
            python tools/build.py
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flashable-zips
          path: dist/*
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
